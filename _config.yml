title: "Warren Buffett's Lessons Explained"
description: "1,091 lessons from 49 Berkshire Hathaway shareholder letters (1977-2025). Moats, capital allocation, and case studies — organized by year and theme."
url: "https://juliuschun.github.io"
baseurl: "/warren-buffett-summary"
theme: minima
lang: en

author: "Moat AI"

# Social / Open Graph
twitter:
  card: summary
social:
  name: Moat AI
  links:
    - https://github.com/juliuschun/eco-moat-ai

header_pages:
  - years.md
  - themes-index.md
  - evidence.md
  - letters-index.md

defaults:
  - scope:
      path: "lessons"
      type: "pages"
    values:
      layout: "page"
      parent: "By Year"
  - scope:
      path: "themes"
      type: "pages"
    values:
      layout: "page"
      parent: "By Theme"
  - scope:
      path: "business-reference"
      type: "pages"
    values:
      layout: "page"
      parent: "Evidence Base"
  - scope:
      path: "case-studies"
      type: "pages"
    values:
      layout: "page"
      parent: "Case Studies"
  - scope:
      path: "letters"
      type: "pages"
    values:
      layout: "page"
      parent: "Original Letters"

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
